name: Update public news JSON
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: news-data-main
  cancel-in-progress: false
jobs:
  update:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Test collector
        run: python -m unittest discover -s tests
      - name: Collect official RSS and update JSON
        run: python scripts/collect_news.py
      - name: Validate UTF-8 JSON and category indexes
        run: python scripts/collect_news.py --validate
      - name: Commit only changed public data
        shell: bash
        run: |
          git add -- news-data
          if git diff --cached --quiet; then
            echo "No data changes; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update public news data"
          git push origin HEAD:main
